[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-devops-agents"
version = "0.1.0"
description = "Multi-agent AIOps reference: a master agent delegating to Kubernetes, CI/CD and observability agents over MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pratheek P Kumar" }]
keywords = ["mcp", "model-context-protocol", "aiops", "devops", "agents", "claude", "kubernetes", "sre"]
dependencies = [
  "mcp>=2.3,<3",
  "anthropic>=2.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
live = ["kubernetes>=31.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
devops-agents = "devops_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
